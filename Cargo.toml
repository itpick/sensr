[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# MSRV is always the latest stable; bumped with rust-toolchain.toml (docs/research/06 §5).
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/itpick/sensr"

# Every version here is the newest stable release on crates.io (checked 2026-11-15).
# Renovate keeps them there; nightly CI fails if one falls >14 days behind.
[workspace.dependencies]
sensr-schema = { path = "crates/sensr-schema" }
sensr-schema-derive = { path = "crates/sensr-schema-derive" }
sensr-config = { path = "crates/sensr-config" }
sensr-rules = { path = "crates/sensr-rules" }
sensr-ipc = { path = "crates/sensr-ipc" }
sensr-auth = { path = "crates/sensr-auth" }
sensr-agent = { path = "crates/sensr-agent" }
sensr-import-opnsense = { path = "crates/sensr-import-opnsense" }
sensr-apply = { path = "crates/sensr-apply" }

anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
bcrypt = "0.19.3"
blake3 = "1.8.7"
ciborium = "0.2.2"
clap = { version = "4.6.7", features = ["derive"] }
console_error_panic_hook = "0.1.7"
fancy-regex = "0.20.2"
futures = "0.3.34"
getrandom = "0.4.3"
indexmap = { version = "2.14.2", features = ["serde"] }
insta = "1.49.0"
inventory = "0.3.25"
ipnet = { version = "2.12.2", features = ["serde"] }
leptos = "0.8.23"
leptos_axum = "0.8.10"
leptos_meta = "0.8.7"
leptos_router = "0.8.17"
md-5 = "0.11.0"
minijinja = "3.1.0"
nftables = "0.6.3"
pretty_assertions = "1.4.1"
proc-macro2 = "1.0.107"
proptest = "1.12.0"
quick-xml = { version = "0.42.0", features = ["serialize"] }
quote = "1.0.47"
regex = "1.13.1"
rtnetlink = "0.24.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
schemars = "1.2.3"
scraper = "0.29.0"
sd-notify = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha-crypt = { version = "0.6.0", features = ["getrandom"] }
similar = "3.2.1"
syn = "3.0.10"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["compression-br", "compression-gzip", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
trybuild = "1.0.125"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
wasm-bindgen = "0.2.130"
web-sys = "0.3.107"

[workspace.lints.cargo]
# The table above pins the whole planned stack at its latest versions before the
# Phase 0 crates use it (docs/PLAN.md §8). Set this back to warn once they do.
unused_workspace_dependencies = "allow"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The wasm island bundle: size over speed (docs/PLAN.md §4 bundle budget).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
