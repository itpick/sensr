[package]
name = "sensr-api"
description = "Unprivileged HTTP API: native REST for config get/set/commit/history/diff, local-user and API-key auth with OPNsense ACLs, and an OPNsense API compat facade; talks to sensr-agent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "sensr-api"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
blake3.workspace = true
clap = { workspace = true, features = ["env"] }
futures.workspace = true
getrandom.workspace = true
hyper.workspace = true
hyper-util.workspace = true
jsonwebtoken.workspace = true
leptos.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
sensr-auth.workspace = true
sensr-flow = { workspace = true, features = ["store"] }
sensr-ipc.workspace = true
sensr-schema.workspace = true
sensr-ui.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
sensr-agent.workspace = true
tempfile.workspace = true

[lints]
workspace = true
