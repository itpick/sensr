[package]
name = "sensr-cli"
description = "sensr command line: config get/set/commit/confirm/rollback/history/diff, OPNsense import, status, apply dry-run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "sensr"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
sensr-flow = { workspace = true, features = ["store"] }
sensr-import-opnsense.workspace = true
sensr-ipc.workspace = true
sensr-scan = { workspace = true, features = ["store", "client"] }
sensr-schema.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
sensr-agent.workspace = true
tempfile.workspace = true

[lints]
workspace = true
