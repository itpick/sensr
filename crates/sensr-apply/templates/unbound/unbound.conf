# Generated by sensr; do not edit.
{% set u = unbound %}
server:
  # systemd runs unbound as its own (dynamic) user: no switch here
  username: ""
  directory: "{{ u.directory }}"
  chroot: ""
  pidfile: ""
  use-syslog: no
  logfile: "{{ u.logfile }}"
  port: {{ u.port }}
  do-ip4: yes
  do-ip6: {{ "yes" if u.ipv6 else "no" }}
  do-udp: yes
  do-tcp: yes
  harden-referral-path: no
  module-config: "{{ u.module_config }}"
{% if u.dnssec %}
  auto-trust-anchor-file: "{{ u.directory }}/root.key"
{% endif %}
{% if u.dns64_prefix %}
  dns64-prefix: {{ u.dns64_prefix }}
{% endif %}
{% for t in u.tuning %}
  {{ t[0] }}: {{ t[1] }}
{% endfor %}

  # Interfaces to bind to
{% if u.listen %}
{% for a in u.listen %}
  interface: {{ a }}
{% endfor %}
{% else %}
  interface: 0.0.0.0
{% if u.ipv6 %}
  interface: ::
{% endif %}
  interface-automatic: yes
{% endif %}
{% for a in u.outgoing %}
  outgoing-interface: {{ a }}
{% endfor %}

  # Access control
  access-control: 0.0.0.0/0 {{ u.default_action }}
  access-control: ::/0 {{ u.default_action }}
  access-control: 127.0.0.0/8 allow
  access-control: ::1/128 allow
{% for acl in u.acls %}
{% if acl.name %}
  # {{ acl.name }}
{% endif %}
  access-control: {{ acl.network }} {{ acl.action }}
{% endfor %}
{% if u.rebind_protection %}

  # DNS rebinding protection
{% for p in u.private_addresses %}
  private-address: {{ p }}
{% endfor %}
{% endif %}
{% for d in u.private_domains %}
  private-domain: "{{ d }}"
{% endfor %}
{% for d in u.insecure_domains %}
  domain-insecure: "{{ d }}"
{% endfor %}

  # Local zone and static records
  local-zone: "{{ u.domain }}." {{ u.local_zone_type }}
{% for z in u.local_zones %}
  local-zone: {{ z }}
{% endfor %}
{% for d in u.local_data %}
  {{ d }}
{% endfor %}
{% if u.tls_bundle %}
  tls-cert-bundle: "{{ u.tls_cert_bundle }}"
{% endif %}
{% for d in u.domain_forwards %}

forward-zone:
  name: "{{ d[0] }}."
{% if d[2] %}
  forward-tls-upstream: yes
{% endif %}
{% for s in d[1] %}
  forward-addr: {{ s }}
{% endfor %}
{% endfor %}
{% if u.forward_addrs %}

forward-zone:
  name: "."
{% if u.any_tls %}
  forward-tls-upstream: yes
{% endif %}
{% for a in u.forward_addrs %}
  forward-addr: {{ a }}
{% endfor %}
{% endif %}

remote-control:
  control-enable: yes
  control-interface: "{{ u.control_socket }}"
  control-use-cert: no
{% if u.register_dhcp_leases or u.blocklist %}

# Written by sensr-dns at run time (absent until it has run: the globs then
# match nothing). Last, because the blocklist opens view: clauses.
server:
{% if u.register_dhcp_leases %}
  include: "{{ u.leases_include }}"
{% endif %}
{% if u.blocklist %}
  include: "{{ u.blocklist_include }}"
{% endif %}
{% endif %}
