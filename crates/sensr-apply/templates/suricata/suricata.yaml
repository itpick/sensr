%YAML 1.1
---
# Generated by sensr; do not edit (Services > Intrusion Detection).
# Mode: {{ s.mode|safe }}. Tuning notes: docs/ids.md.
suricata-version: "8.0"

include:
  - {{ s.dir ~ "/vars.yaml" }}

default-log-dir: {{ s.log_dir }}
default-rule-path: {{ s.rule_dir }}
rule-files:
{% for f in s.rule_files %}
  - {{ f }}
{% endfor %}
  - {{ s.dir ~ "/local.rules" }}
classification-file: {{ s.rule_dir ~ "/classification.config" }}
reference-config-file: {{ s.rule_dir ~ "/reference.config" }}
threshold-file: {{ s.dir ~ "/threshold.config" }}

stats:
  enabled: yes
  interval: 30

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      community-id: true
      types:
        - alert:
            payload: {{ s.yes.payload }}
            payload-printable: {{ s.yes.payload }}
            packet: no
            metadata: yes
            tagged-packets: no
{% if s.prevent %}
        - drop:
            alerts: yes
            flows: start
{% endif %}
{% if s.http %}
        - http:
            extended: yes
{% endif %}
{% if s.tls %}
        - tls:
            extended: yes
{% endif %}
        - stats:
            totals: yes
            threads: no
            deltas: no
{% if s.syslog %}
  - syslog:
      enabled: yes
      identity: suricata
      facility: local5
      level: Info
{% endif %}

logging:
  default-log-level: notice
  outputs:
    - console:
        enabled: yes
    - file:
        enabled: no

unix-command:
  enabled: yes
  filename: {{ s.socket }}

{% if s.prevent %}
nfq:
  mode: accept
  # flows Suricata stops inspecting (stream depth reached, pass/bypass rules)
  # get this mark; nftables copies it to the connection and stops queueing
  bypass-mark: {{ s.bypass_mark }}
  bypass-mask: {{ s.bypass_mark }}
  fail-open: {{ s.yes.fail_open }}
{% else %}
af-packet:
{% for i in s.capture %}
  - interface: {{ i.device }}
    threads: {{ i.threads }}
    cluster-id: {{ i.cluster_id }}
    cluster-type: cluster_flow
    defrag: yes
    use-mmap: yes
    tpacket-v3: yes
    ring-size: {{ s.ring_size }}
    block-size: 1048576
    promisc: {{ s.yes.promiscuous }}
    checksum-checks: kernel
{% endfor %}
{% endif %}

app-layer:
  protocols:
    telnet: { enabled: yes }
    rfb: { enabled: yes }
    mqtt: { enabled: yes }
    krb5: { enabled: yes }
    bittorrent-dht: { enabled: yes }
    snmp: { enabled: yes }
    ike: { enabled: yes }
    tls:
      enabled: yes
      detection-ports:
        dp: 443
    pgsql: { enabled: no }
    dcerpc: { enabled: yes }
    ftp: { enabled: yes }
    websocket: { enabled: yes }
    rdp: { enabled: yes }
    ssh: { enabled: yes }
    doh2: { enabled: yes }
    http2: { enabled: yes }
    smtp: { enabled: yes }
    imap: { enabled: detection-only }
    pop3: { enabled: yes }
    smb:
      enabled: yes
      detection-ports:
        dp: 139, 445
    nfs: { enabled: yes }
    tftp: { enabled: yes }
    dns:
      tcp: { enabled: yes }
      udp: { enabled: yes }
    http:
      enabled: yes
      libhtp:
        default-config:
          personality: IDS
          request-body-limit: 100 KiB
          response-body-limit: 100 KiB
    modbus: { enabled: no }
    dnp3: { enabled: no }
    enip: { enabled: no }
    ntp: { enabled: yes }
    quic: { enabled: yes }
    dhcp: { enabled: yes }
    sip: { enabled: yes }
    ldap: { tcp: { enabled: yes }, udp: { enabled: yes } }
    mdns: { enabled: yes }

# A memcap or parser failure lets the flow through instead of dropping it.
exception-policy: {{ s.exception_policy }}

host-mode: {{ s.host_mode }}
max-pending-packets: 2048
{% if s.default_packet_size %}
default-packet-size: {{ s.default_packet_size }}
{% endif %}

flow:
  memcap: 128 MiB
  hash-size: 65536
  prealloc: 10000
  emergency-recovery: 30

stream:
  memcap: 128 MiB
  checksum-validation: no
  inline: auto
  # connections already open when Suricata (re)starts are picked up instead
  # of having their packets dropped as stream_midstream
  midstream: {{ s.midstream }}
  async-oneside: {{ s.midstream }}
{% if s.prevent %}
  bypass: yes
{% endif %}
  reassembly:
    memcap: 256 MiB
    depth: 1 MiB
    toserver-chunk-size: 2560
    toclient-chunk-size: 2560
    randomize-chunk-size: yes

detect:
  profile: {{ s.detect_profile }}
  sgh-mpm-context: auto
  sgh-mpm-caching: yes
  sgh-mpm-caching-path: {{ s.state_dir ~ "/cache/sgh" }}
  prefilter:
    default: mpm

mpm-algo: {{ s.mpm }}
spm-algo: auto

threading:
{% if s.worker_cpus %}
  set-cpu-affinity: yes
  cpu-affinity:
    management-cpu-set:
      cpu: [ 0 ]
    worker-cpu-set:
      cpu: [ {{ s.worker_cpus }} ]
      mode: exclusive
{% else %}
  set-cpu-affinity: no
{% endif %}
  detect-thread-ratio: 1.0

security:
  limit-noproc: true
