[package]
name = "sensr-agent"
description = "The privileged daemon: owns the config store, runs the apply pipeline and commit-confirm, serves sensr-ipc."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "sensr-agent"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
blake3.workspace = true
clap = { workspace = true, features = ["env"] }
getrandom.workspace = true
ipnet.workspace = true
rcgen.workspace = true
sd-notify.workspace = true
sensr-apply.workspace = true
sensr-auth.workspace = true
sensr-config.workspace = true
sensr-feeds.workspace = true
sensr-fingerprint.workspace = true
sensr-import-opnsense.workspace = true
sensr-ipc.workspace = true
sensr-monitor.workspace = true
sensr-net.workspace = true
sensr-rules.workspace = true
sensr-schema.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
similar.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# ARP interception: AF_PACKET (socket2 opens it for ETH_P_ARP; nix sends and
# receives with the kernel's own link addresses)
nix = { version = "0.32", features = ["socket", "net", "poll"] }
socket2.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
