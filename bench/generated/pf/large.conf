lan = "vio0"
wan = "vio1"
lan_net = "192.168.1.0/24"

table <iot_devices> persist file "/etc/pf/iot_devices.txt"
table <kids_devices> persist file "/etc/pf/kids_devices.txt"
table <admin_hosts> persist file "/etc/pf/admin_hosts.txt"
table <work_vpn_nets> persist file "/etc/pf/work_vpn_nets.txt"
table <blocklist_v4> persist file "/etc/pf/blocklist_v4.txt"

set skip on lo

match out on $wan inet from $lan_net nat-to ($wan)
block log all
pass out quick inet
pass in quick on $lan inet proto tcp to self port { 22 80 443 }  # anti-lockout

pass in quick on $lan inet proto udp from $lan_net to self port 53  # DNS to router
pass in quick on $lan inet proto tcp from $lan_net to self port 53  # DNS/TCP to router
pass in quick on $lan inet proto udp from $lan_net to self port 123  # NTP to router
pass in quick on $lan inet proto udp from $lan_net to self port 67  # DHCP
pass in quick on $lan inet proto tcp from <admin_hosts> to self port 22  # admin SSH
pass in quick on $lan inet proto tcp from <admin_hosts> to self port 443  # admin GUI
pass in quick on $lan inet proto icmp from $lan_net to self  # ping router
block in quick on $lan inet from $lan_net to <blocklist_v4>  # blocklist
block in quick on $lan inet proto tcp from <iot_devices> to any port { 25 465 587 993 995 }  # IoT no mail
block in quick on $lan inet from <iot_devices> to <work_vpn_nets>  # IoT not to work
pass in quick on $lan inet proto tcp from <iot_devices> to any port { 80 443 8080 8443 }  # IoT web
pass in quick on $lan inet proto udp from <iot_devices> to any port 123  # IoT NTP
block in quick on $lan inet from <iot_devices> to any  # IoT default deny
block in quick on $lan inet proto tcp from <kids_devices> to any port 6881:6889  # kids no bittorrent
block in quick on $lan inet proto udp from <kids_devices> to any port 3478:3480  # kids no STUN
pass in quick on $lan inet proto tcp from <kids_devices> to any port { 80 443 8080 8443 }  # kids web
block in quick on $lan inet from <kids_devices> to any  # kids default deny
block in quick on $lan inet proto tcp from $lan_net to any port 445  # no SMB out
block in quick on $lan inet proto tcp from $lan_net to any port 135:139  # no NetBIOS out
block in quick on $lan inet proto udp from $lan_net to any port 137:138  # no NetBIOS/udp out
block in quick on $lan inet proto udp from $lan_net to any port 1900  # no SSDP out
block in quick on $lan inet proto tcp from $lan_net to any port 23  # no telnet out
