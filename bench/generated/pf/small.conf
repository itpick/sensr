lan = "vio0"
wan = "vio1"
lan_net = "192.168.1.0/24"

table <iot_devices> persist file "/etc/pf/iot_devices.txt"
table <kids_devices> persist file "/etc/pf/kids_devices.txt"
table <admin_hosts> persist file "/etc/pf/admin_hosts.txt"
table <work_vpn_nets> persist file "/etc/pf/work_vpn_nets.txt"
table <blocklist_v4> persist file "/etc/pf/blocklist_v4.txt"

set skip on lo

match out on $wan inet from $lan_net nat-to ($wan)
block log all
pass out quick inet
pass in quick on $lan inet proto tcp to self port { 22 80 443 }  # anti-lockout

pass in quick on $lan inet proto udp from $lan_net to self port 53  # DNS to router
pass in quick on $lan inet proto tcp from $lan_net to self port 53  # DNS/TCP to router
pass in quick on $lan inet proto udp from $lan_net to self port 123  # NTP to router
pass in quick on $lan inet proto udp from $lan_net to self port 67  # DHCP
pass in quick on $lan inet proto tcp from <admin_hosts> to self port 22  # admin SSH
pass in quick on $lan inet proto tcp from <admin_hosts> to self port 443  # admin GUI
pass in quick on $lan inet proto icmp from $lan_net to self  # ping router
block in quick on $lan inet from $lan_net to <blocklist_v4>  # blocklist
block in quick on $lan inet proto tcp from <iot_devices> to any port { 25 465 587 993 995 }  # IoT no mail
block in quick on $lan inet from <iot_devices> to <work_vpn_nets>  # IoT not to work
pass in quick on $lan inet proto tcp from <iot_devices> to any port { 80 443 8080 8443 }  # IoT web
pass in quick on $lan inet proto udp from <iot_devices> to any port 123  # IoT NTP
block in quick on $lan inet from <iot_devices> to any  # IoT default deny
block in quick on $lan inet proto tcp from <kids_devices> to any port 6881:6889  # kids no bittorrent
block in quick on $lan inet proto udp from <kids_devices> to any port 3478:3480  # kids no STUN
pass in quick on $lan inet proto tcp from <kids_devices> to any port { 80 443 8080 8443 }  # kids web
block in quick on $lan inet from <kids_devices> to any  # kids default deny
block in quick on $lan inet proto tcp from $lan_net to any port 445  # no SMB out
block in quick on $lan inet proto tcp from $lan_net to any port 135:139  # no NetBIOS out
block in quick on $lan inet proto udp from $lan_net to any port 137:138  # no NetBIOS/udp out
block in quick on $lan inet proto udp from $lan_net to any port 1900  # no SSDP out
block in quick on $lan inet proto tcp from $lan_net to any port 23  # no telnet out
pass in quick on $lan inet proto udp from 192.168.1.60 to 198.18.0.0/24 port 7000  # host exception 0
block in quick on $lan inet proto tcp from 192.168.1.61 to 198.18.1.0/24 port 7001  # host exception 1
pass in quick on $lan inet proto tcp from 192.168.1.62 to 198.18.2.0/24 port 7002  # host exception 2
block in quick on $lan inet proto udp from 192.168.1.63 to 198.18.3.0/24 port 7003  # host exception 3
pass in quick on $lan inet proto tcp from 192.168.1.64 to 198.18.4.0/24 port 7004  # host exception 4
block in quick on $lan inet proto tcp from 192.168.1.65 to 198.18.5.0/24 port 7005  # host exception 5
pass in quick on $lan inet proto udp from 192.168.1.66 to 198.18.6.0/24 port 7006  # host exception 6
block in quick on $lan inet proto tcp from 192.168.1.67 to 198.18.7.0/24 port 7007  # host exception 7
pass in quick on $lan inet proto tcp from 192.168.1.68 to 198.18.8.0/24 port 7008  # host exception 8
block in quick on $lan inet proto udp from 192.168.1.69 to 198.18.9.0/24 port 7009  # host exception 9
pass in quick on $lan inet proto tcp from 192.168.1.70 to 198.18.10.0/24 port 7010  # host exception 10
block in quick on $lan inet proto tcp from 192.168.1.71 to 198.18.11.0/24 port 7011  # host exception 11
pass in quick on $lan inet proto udp from 192.168.1.72 to 198.18.12.0/24 port 7012  # host exception 12
block in quick on $lan inet proto tcp from 192.168.1.73 to 198.18.13.0/24 port 7013  # host exception 13
pass in quick on $lan inet proto tcp from 192.168.1.74 to 198.18.14.0/24 port 7014  # host exception 14
block in quick on $lan inet proto udp from 192.168.1.75 to 198.18.15.0/24 port 7015  # host exception 15
pass in quick on $lan inet proto tcp from 192.168.1.76 to 198.18.16.0/24 port 7016  # host exception 16
block in quick on $lan inet proto tcp from 192.168.1.77 to 198.18.17.0/24 port 7017  # host exception 17
pass in quick on $lan inet proto udp from 192.168.1.78 to 198.18.18.0/24 port 7018  # host exception 18
block in quick on $lan inet proto tcp from 192.168.1.79 to 198.18.19.0/24 port 7019  # host exception 19
pass in quick on $lan inet proto tcp from 192.168.1.80 to 198.18.20.0/24 port 7020  # host exception 20
block in quick on $lan inet proto udp from 192.168.1.81 to 198.18.21.0/24 port 7021  # host exception 21
pass in quick on $lan inet proto tcp from 192.168.1.82 to 198.18.22.0/24 port 7022  # host exception 22
pass in quick on $lan inet from $lan_net to any  # LAN to any
block in quick on $wan inet from <blocklist_v4> to any  # WAN blocklist
pass in quick on $wan inet proto icmp from any to self  # WAN ping
block in quick on $wan inet proto tcp from any to self port 22  # WAN SSH
block in quick on $wan inet proto tcp from any to self port 443  # WAN GUI
