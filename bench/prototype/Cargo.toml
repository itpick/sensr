[package]
name = "sensr-proto"
version = "0.1.0"
edition = "2021"
description = "Throwaway benchmark prototype: lower-bound cost of a Rust nftables control plane"

# standalone: not a member of the sensr workspace (benchmark reference copy)
[workspace]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
