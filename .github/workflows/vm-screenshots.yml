# Screenshots of the web UI dashboard from the house VM test, with example
# devices on the LAN (smart labels, leases, host modes, traffic graphs).
# The PNGs are the "vm-dashboard-screenshots" artifact:
#
#   gh workflow run vm-screenshots.yml --ref <branch>
#   gh run download <run-id> -n vm-dashboard-screenshots -D shots
name: vm-screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - nix/tests/house.nix
      - nix/tests/house/**
      - crates/sensr-ui/**
      - crates/sensr-fingerprint/**
      - .github/workflows/vm-screenshots.yml

concurrency:
  group: vm-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Make room for the store (VM closures)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Let the nix sandbox use KVM (VM tests)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            system-features = nixos-test benchmark big-parallel kvm
      # Binary cache (see "CI binary cache" in README.md). No-op until the
      # CACHIX_CACHE variable exists; pulls without a token; pushes only
      # outside pull_request runs. Disk images are not pushed: they are
      # large, never substituted (release.yml recompresses them anyway), and
      # would burn the free-tier quota. Toplevels and the crane dependency
      # closures are what make the next build fast.
      - uses: cachix/cachix-action@v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: ${{ github.event_name == 'pull_request' }}
          pushFilter: '(\.img(\.zst)?|\.iso|\.qcow2?|-sd-image-.*|-nixos-disk-image|-installer.*)$'
      - name: House test with example devices, then screenshots
        run: nix build -L .#screenshots.x86_64-linux.house -o result
      - name: Collect
        if: always()
        run: |
          mkdir -p shots
          if [ -d result/screenshots ]; then cp result/screenshots/*.png shots/; fi
          if [ -e result/house-results.json ]; then cp result/house-results.json shots/; fi
          ls -la shots
          for f in shots/*.png; do [ -e "$f" ] && echo "- $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"; done; true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: vm-dashboard-screenshots
          path: shots/
          if-no-files-found: warn
          retention-days: 14
