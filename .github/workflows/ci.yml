name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *" # nightly: freshness + audit (docs/research/06 §5)

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup show # installs the toolchain pinned in rust-toolchain.toml
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  nft-goldens:
    # every nft JSON golden must load into a real kernel (nft -c: check, no commit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q nftables
      - run: nft --version
      - run: NFT_WRAP=sudo scripts/nft-check-goldens.sh
      # the boot apply's emergency firewall
      - run: NFT_WRAP=sudo scripts/nft-check-goldens.sh crates/sensr-apply/tests/golden

  boot-scripts:
    # the Pi bootloader installer against fake FAT partitions (no Nix, no Pi)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: bash nix/pi5/install-boot-test.sh

  xtask:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - name: Test parity does not fall (docs/PLAN.md §4)
        run: cargo xtask parity --check --badge parity.svg
      - run: cargo xtask lint-fixtures
      - name: Fetch the pinned OPNsense core and plugins trees (shallow)
        run: |
          for r in core plugins; do
            pin=$(awk -v r=$r '$1==r {print $2}' reference/REFS)
            git init -q reference/opnsense/$r
            git -C reference/opnsense/$r fetch -q --depth 1 https://github.com/opnsense/$r.git "$pin"
            git -C reference/opnsense/$r checkout -q FETCH_HEAD
          done
      - name: Source coverage manifest matches the pinned trees (docs/PLAN.md §2.6)
        run: cargo xtask source-coverage --check --require-tree --report | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Flake inputs and toolchain are fresh (nightly)
        if: github.event_name == 'schedule'
        run: cargo xtask freshness --daemons

  nic-recover:
    # the Ethernet adapter watchdog against a fake /sys (no Pi needed)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: bash nix/modules/nic-recover-test.sh

  ui:
    # sensr-ui: wasm clippy, release build with cargo-leptos, island bundle budget,
    # browser tests (screenshots light/dark × desktop/phone, axe, interactions, load timings).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos@0.3.12
      - run: cargo clippy -p sensr-ui --lib --target wasm32-unknown-unknown --no-default-features --features hydrate -- -D warnings
      - run: cargo leptos build --release
      - name: Island bundle budget
        run: |
          sudo apt-get install -y --no-install-recommends brotli >/dev/null
          crates/sensr-ui/scripts/bundle-size.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Browser tests
        working-directory: crates/sensr-ui/e2e
        env:
          SENSR_UI_SHOTS: ${{ github.workspace }}/ui-screenshots
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
          { echo '### Load timings (headless Chromium, median of 5, cold cache)'; echo '```json'; cat "$SENSR_UI_SHOTS/perf.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Browser tests against sensr-agent + sensr-api
        run: |
          cargo build --release -p sensr-agent -p sensr-api
          sock=$(mktemp -u /tmp/sensr-XXXXXX.sock)
          target/release/sensr-agent --socket "$sock" --socket-mode 600 --trust-uid "$(id -u)" \
            --seed crates/sensr-ui/e2e/fixtures/agent-seed.json --applier preview &
          for i in $(seq 50); do [ -S "$sock" ] && break; sleep 0.2; done
          # loopback test stack: plain HTTP is opt-in (--insecure-http); the box serves HTTPS
          target/release/sensr-api --listen 127.0.0.1:3400 --insecure-http --socket "$sock" --ui-root target/site &
          for i in $(seq 50); do curl -sf http://127.0.0.1:3400/healthz >/dev/null && break; sleep 0.2; done
          cd crates/sensr-ui/e2e
          # schema.spec.ts needs sensr-schema validation in the agent, which is not wired yet.
          SENSR_UI_BASE_URL=http://127.0.0.1:3400 SENSR_UI_SHOTS="$GITHUB_WORKSPACE/ui-screenshots-stack" \
            npx playwright test tests/interactions.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensr-ui-screenshots
          path: |
            ui-screenshots
            ui-screenshots-stack
            crates/sensr-ui/e2e/test-results
          if-no-files-found: ignore

  deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit,cargo-outdated
      - run: cargo deny check
      - run: cargo audit
      - name: Fail if any direct dependency is behind its latest release
        run: cargo outdated --workspace --root-deps-only --exit-code 1

  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Make room for the store (images and VM closures)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Let the nix sandbox use KVM (VM tests)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            system-features = nixos-test benchmark big-parallel kvm
      # Binary cache (see "CI binary cache" in README.md). No-op until the
      # CACHIX_CACHE variable exists; pulls without a token; pushes only
      # outside pull_request runs. Disk images are not pushed: they are
      # large, never substituted (release.yml recompresses them anyway), and
      # would burn the free-tier quota. Toplevels and the crane dependency
      # closures are what make the next build fast.
      - uses: cachix/cachix-action@v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: ${{ github.event_name == 'pull_request' }}
          pushFilter: '(\.img(\.zst)?|\.iso|\.qcow2?|-sd-image-.*|-nixos-disk-image|-installer.*)$'
      - run: nix flake check --all-systems --no-build
      - name: Build sensr, the qcow image, and run the VM checks
        run: nix flake check -L --keep-going
      - run: nix build -L .#images.qcow
      - name: Boot times and image size
        run: |
          out=$(nix build --print-out-paths .#checks.x86_64-linux.qcow-boot)
          echo "qcow boots (s): $(tr '\n' ' ' < $out/boot-seconds)" >> "$GITHUB_STEP_SUMMARY"
          echo "qcow image bytes: $(cat $out/image-bytes)" >> "$GITHUB_STEP_SUMMARY"

  nix-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      # Binary cache (see "CI binary cache" in README.md). No-op until the
      # CACHIX_CACHE variable exists; pulls without a token; pushes only
      # outside pull_request runs. Disk images are not pushed: they are
      # large, never substituted (release.yml recompresses them anyway), and
      # would burn the free-tier quota. Toplevels and the crane dependency
      # closures are what make the next build fast.
      - uses: cachix/cachix-action@v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: ${{ github.event_name == 'pull_request' }}
          pushFilter: '(\.img(\.zst)?|\.iso|\.qcow2?|-sd-image-.*|-nixos-disk-image|-installer.*)$'
      - run: nix build -L .#checks.aarch64-linux.sensr
      - name: Build the Pi 4 and Pi 5 images
        run: |
          nix build -L .#images.pi4 -o pi4
          nix build -L .#images.pi5 -o pi5
      - name: Image sizes
        run: |
          mkdir -p out
          for b in pi4 pi5; do
            img=$(echo $b/sd-image/*.img)
            echo "$b image: $(stat -L -c %s "$img") bytes" >> "$GITHUB_STEP_SUMMARY"
            # Stable names: the install page and the one-liner link to
            # releases/latest/download/sensr-$b.img.zst.
            zstd -T0 -10 -o "out/sensr-$b.img.zst" "$img"
          done
      # Boot-tested under QEMU on the nixtop builder (nix/tests/pi5-qemu.sh),
      # not here: no hardware and no KVM on this runner.
      - uses: actions/upload-artifact@v5
        with:
          name: sensr-pi4-image
          path: out/sensr-pi4.img.zst
          retention-days: 7
      - uses: actions/upload-artifact@v5
        with:
          name: sensr-pi5-image
          path: out/sensr-pi5.img.zst
          retention-days: 7
