name: oui-refresh

# Monthly: re-download the IEEE registries and open a PR if the embedded
# table (crates/sensr-fingerprint/data/oui.tsv) changed.
on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - run: cargo xtask oui
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/oui-refresh
          title: "fingerprint: refresh the IEEE OUI table"
          commit-message: "fingerprint: refresh the IEEE OUI table"
          body: Regenerated by `cargo xtask oui` from the IEEE MA-L, MA-M and MA-S registries.
          add-paths: crates/sensr-fingerprint/data/oui.tsv
